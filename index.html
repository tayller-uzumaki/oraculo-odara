<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oráculo Odù - Consulta de Búzios</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b0612; color: #f3f4f6; min-height: 100vh; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 700px; background: #150a24; border: 1px solid #332147; border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1, h2, h3 { color: #fbbf24; text-align: center; margin-bottom: 16px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; color: #d4d4d8; font-size: 14px; }
    input, select { width: 100%; padding: 12px; background: #0b0612; border: 1px solid #332147; border-radius: 6px; color: #fff; font-size: 14px; }
    input:focus, select:focus { outline: none; border-color: #f59e0b; }
    button { width: 100%; padding: 14px; background: #f59e0b; color: #0b0612; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s; font-size: 16px; }
    button:hover { background: #d97706; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .card-resultado { background: #0b0612; border: 1px solid #f59e0b; border-radius: 8px; padding: 16px; margin-top: 20px; display: none; }
    .mesa { width: 100%; height: 220px; background: #28173d; border-radius: 50%; border: 4px solid #78350f; position: relative; margin: 20px 0; display: none; overflow: hidden; }
    .mesa-chacoalhando { animation: shake 0.3s infinite; }
    @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 20% { transform: translate(-2px, 0px) rotate(-1deg); } 40% { transform: translate(1px, -1px) rotate(1deg); } 60% { transform: translate(-1px, 2px) rotate(0deg); } 80% { transform: translate(2px, 1px) rotate(1deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }
    .buzio { width: 28px; height: 38px; position: absolute; transition: all 0.5s ease; }
    .tag-gold { background: #f59e0b; color: #0b0612; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
    .favorability-container { margin: 12px 0; }
    .favorability-bar-bg { width: 100%; height: 8px; background: #332147; border-radius: 4px; margin-top: 4px; overflow: hidden; }
    .favorability-bar-fill { height: 100%; background: #fbbf24; border-radius: 4px; }
    .pacote-card { background: #0b0612; border: 1px solid #332147; padding: 12px; border-radius: 8px; text-align: center; cursor: pointer; flex: 1; }
    .pacote-card.active { border-color: #f59e0b; background: #28173d; }
  </style>
</head>
<body>

<div class="container">
  <h1>✨ Oráculo Odù ✨</h1>

  <!-- ETAPA 1: Odù de Nascimento -->
  <section id="secao-odu-nascimento">
    <h2>1. Mapeamento do Odù de Nascimento</h2>
    <form id="form-odu">
      <div class="form-group">
        <label for="nome">Seu Nome Completo:</label>
        <input type="text" id="nome" placeholder="Digite seu nome" required>
      </div>
      <div class="form-group">
        <label for="dataNasc">Data de Nascimento:</label>
        <input type="date" id="dataNasc" required>
      </div>
      <button type="submit" id="btn-calc-odu">🔮 Descobrir Meu Odù</button>
    </form>

    <div id="resultado-odu" class="card-resultado">
      <h3>Odù Revelado: <span id="odu-nome"></span> (<span id="odu-numero"></span>)</h3>
      <p style="margin-bottom: 6px;"><strong>Orixá Regente:</strong> <span id="odu-orixa"></span></p>
      <p style="margin-bottom: 12px;"><strong>Elemento:</strong> <span id="odu-elemento"></span></p>
      <div id="odu-caminho"></div>
    </div>
  </section>

  <hr style="border: 0; border-top: 1px solid #332147; margin: 30px 0;">

  <!-- ETAPA 2: Pacotes e Pagamento -->
  <section id="secao-pacotes">
    <h2>2. Adquirir Consultas de Búzios</h2>
    <div style="display: flex; gap: 12px; margin-bottom: 16px;">
      <div id="pacote-5" class="pacote-card active" onclick="selecionarPacote(5, 25.99)">
        <h3>5 Consultas</h3>
        <p style="color: #fbbf24;">R$ 25,99</p>
      </div>
      <div id="pacote-10" class="pacote-card" onclick="selecionarPacote(10, 45.99)">
        <h3>10 Consultas</h3>
        <p style="color: #fbbf24;">R$ 45,99</p>
      </div>
    </div>
    <button type="button" onclick="gerarPix()">🔑 Gerar Chave PIX</button>
    <div id="area-pix"></div>
  </section>

  <hr style="border: 0; border-top: 1px solid #332147; margin: 30px 0;">

  <!-- ETAPA 3: Consulta de Búzios -->
  <section id="secao-jogada" style="display: block;">
    <h2>3. Faça sua Consulta aos Búzios</h2>
    <p style="text-align: center; margin-bottom: 12px; font-size: 14px; color: #a1a1aa;">
      Saldo disponível: <strong id="qtd-perguntas" style="color: #fbbf24;">5</strong> consulta(s)
    </p>

    <form id="form-consulta">
      <div class="form-group">
        <label for="area-foco">Área de Foco:</label>
        <select id="area-foco">
          <option value="Geral">Geral / Orientação</option>
          <option value="Amor">Amor / Relacionamentos</option>
          <option value="Trabalho">Trabalho / Carreira</option>
          <option value="Finanças">Finanças / Prosperidade</option>
          <option value="Saúde">Saúde / Bem-estar</option>
        </select>
      </div>
      <div class="form-group">
        <label for="pergunta">Sua Pergunta ao Oráculo:</label>
        <input type="text" id="pergunta" placeholder="Ex: Devo mudar de emprego este mês?" required>
      </div>
      <button type="submit" id="btn-jogar">🐚 Lançar os Búzios</button>
    </form>

    <p id="status-jogo" style="text-align: center; margin-top: 12px; color: #fbbf24; font-size: 14px; min-height: 20px;"></p>

    <div id="mesa-buzios" class="mesa">
      <div id="peneira"></div>
    </div>

    <div id="resultado-leitura" class="card-resultado"></div>
  </section>
</div>

<script src="script.js"></script>
</body>
</html>
