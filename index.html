<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oráculo Odù — Sabedoria dos Búzios</title>
  <style>
    :root {
      --bg-main: #0b0612;
      --card-bg: #150a24;
      --card-dark: #11071f;
      --gold-light: #fde68a;
      --gold-accent: #f59e0b;
      --text-main: #e4e4e7;
      --text-sub: #a1a1aa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      color: var(--gold-accent);
      font-size: 2rem;
      margin-bottom: 6px;
    }

    .header p {
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid #332147;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      color: var(--gold-light);
      font-size: 0.9rem;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input[type="date"],
    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 12px;
      background: #0b0612;
      border: 1px solid #332147;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--gold-accent);
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
      color: #0f0a1c;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    .btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* PACOTES */
    .pacotes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }

    .card-pacote {
      background: #0b0612;
      border: 2px solid #332147;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .card-pacote.active {
      border-color: var(--gold-accent);
      background: #1a0c30;
    }

    .card-pacote h4 {
      color: var(--gold-light);
      font-size: 1.1rem;
      margin-bottom: 4px;
    }

    .card-pacote p {
      color: var(--gold-accent);
      font-weight: bold;
      font-size: 1.2rem;
    }

    /* MESA DE BÚZIOS E ANIMAÇÕES */
    .mesa-container {
      text-align: center;
      margin: 20px 0;
    }

    .peneira-bg {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 0 auto;
      border-radius: 50%;
      background: radial-gradient(circle, #2a1542 0%, #0d0517 100%);
      border: 4px solid var(--gold-accent);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8), 0 0 15px rgba(245, 158, 11, 0.2);
      overflow: hidden;
    }

    .mesa-chacoalhando {
      animation: chacoalhar 0.15s infinite alternate;
    }

    @keyframes chacoalhar {
      0% { transform: translate(2px, 2px) rotate(0deg); }
      100% { transform: translate(-2px, -2px) rotate(1deg); }
    }

    .buzio {
      position: absolute;
      width: 28px;
      height: 38px;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .status-texto {
      margin-top: 12px;
      color: var(--gold-light);
      font-size: 0.95rem;
      font-style: italic;
    }

    /* BARRA DE FAVORABILIDADE */
    .favorability-container {
      margin: 12px 0;
    }

    .favorability-bar-bg {
      width: 100%;
      height: 10px;
      background: #27143a;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 4px;
    }

    .favorability-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #f59e0b 0%, #10b981 100%);
      transition: width 1s ease-out;
    }
  </style>
</head>
<body>

<div class="container">
  
  <div class="header">
    <h1>🔮 Oráculo Sagrado dos Odùs</h1>
    <p>Consulte seu regente de nascimento e obtenha orientação nos Búzios</p>
  </div>

  <!-- ETAPA 1: ODÙ DE NASCIMENTO -->
  <div class="card">
    <h2 style="color: var(--gold-accent); font-size: 1.2rem; margin-bottom: 12px;">1. Mapear Odù de Nascimento</h2>
    <form id="form-odu">
      <div class="form-group">
        <label for="dataNasc">Sua Data de Nascimento:</label>
        <input type="date" id="dataNasc" required />
      </div>
      <button type="submit" id="btn-calc-odu" class="btn-primary">✨ Mapear Força Ancestral</button>
    </form>
  </div>

  <!-- PAINEL DO ODÙ REVELADO -->
  <div id="resultado-odu" class="card" style="display: none;"></div>

  <!-- ETAPA 2: SELEÇÃO DE PACOTES DE CONSULTA -->
  <div id="secao-pacotes" class="card">
    <h2 style="color: var(--gold-accent); font-size: 1.2rem; margin-bottom: 12px;">2. Escolha seu Pacote de Consultas</h2>
    
    <div class="pacotes-grid">
      <div id="pacote-5" class="card-pacote active" onclick="selecionarPacote(5, 25.99)">
        <h4>5 Consultas</h4>
        <p>R$ 25,99</p>
      </div>
      <div id="pacote-10" class="card-pacote" onclick="selecionarPacote(10, 45.99)">
        <h4>10 Consultas</h4>
        <p>R$ 45,99</p>
      </div>
    </div>

    <button onclick="gerarPix()" class="btn-primary">🔑 Liberar Consultas</button>
  </div>

  <!-- ETAPA 3: CONSULTA DE BÚZIOS -->
  <div id="secao-jogada" class="card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h2 style="color: var(--gold-accent); font-size: 1.2rem;">3. Jogo Sagrado de Búzios</h2>
      <span style="background: #27143a; color: var(--gold-light); padding: 4px 12px; border-radius: 12px; font-size: 0.85rem; border: 1px solid #332147;">
        Consultas Restantes: <strong id="qtd-perguntas" style="color: var(--gold-accent);">0</strong>
      </span>
    </div>

    <form id="form-consulta">
      <div class="form-group">
        <label for="area-foco">Área da Consulta:</label>
        <select id="area-foco" required>
          <option value="Amor e Relacionamentos">Amor e Relacionamentos</option>
          <option value="Trabalho e Carreira">Trabalho e Carreira</option>
          <option value="Finanças e Negócios">Finanças e Negócios</option>
          <option value="Saúde e Bem-Estar">Saúde e Bem-Estar</option>
          <option value="Espiritualidade e Proteção">Espiritualidade e Proteção</option>
        </select>
      </div>

      <div class="form-group">
        <label for="pergunta">Sua Pergunta Objetiva:</label>
        <textarea id="pergunta" placeholder="Ex: Devo investir neste projeto profissional nos próximos meses?" required></textarea>
      </div>

      <button type="submit" id="btn-jogar" class="btn-primary">🐚 Lançar os Búzios na Mesa</button>
    </form>

    <!-- MESA E ANIMAÇÃO -->
    <div id="mesa-buzios" class="mesa-container" style="display: none;">
      <div id="peneira" class="peneira-bg"></div>
      <p id="status-jogo" class="status-texto"></p>
    </div>

    <!-- RESULTADO DA LEITURA -->
    <div id="resultado-leitura" style="display: none; margin-top: 20px;"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
